name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test -- --ci

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0
      # Postgres only: migrations and seed apply, then pgTAP runs against them.
      - run: supabase db start
      - run: supabase db lint --level warning --fail-on error
      - run: supabase test db

  # Applies new migrations to staging once main's database checks pass. The secrets live in the
  # staging environment, which only main may use; link finds the IPv4 pooler the runner can reach.
  staging:
    if: github.event_name == 'push'
    needs: db
    runs-on: ubuntu-latest
    environment: staging
    concurrency: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase db push --yes
