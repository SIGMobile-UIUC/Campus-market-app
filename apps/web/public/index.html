<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Market</title>
  <link rel="icon" href="/icon.png">
  <meta name="description" content="Buy and sell with students at your school.">
  <style>
    :root { --bg: #fff; --surface: #f1f2f4; --ink: #17181a; --muted: #5e6168; --primary: #334155; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f0f10; --surface: #1b1b1e; --ink: #f2f2f2; --muted: #a6a6ab; --primary: #cbd5e1; }
    }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
    main { max-width: 480px; margin: 0 auto; padding: 64px 16px; text-align: center; }
    p { color: var(--muted); }
    a { display: block; margin-top: 24px; padding: 14px; border-radius: 12px; background: var(--primary); color: var(--bg); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>Campus Market</h1>
    <p>Buy and sell with students at your school: verified school emails, safe meetup spots and move-out sales.</p>
    <a href="/app">Get the app</a>
  </main>
</body>
</html>
